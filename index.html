
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAEKOOK MOMENTS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10090d;color:#f8eaf0;font-family:Arial,sans-serif}
header{text-align:center;padding:25px 15px 15px}
h1{font-size:25px;letter-spacing:3px;color:#e8b6c9}
button,select{background:#642d45;color:white;border:1px solid #a75c79;border-radius:10px;padding:11px;margin:5px;font-size:14px}
button:active{opacity:.7}
#menu{display:grid;grid-template-columns:1fr 1fr;gap:13px;padding:15px}
.tile{height:115px;border:1px solid #653247;border-radius:15px;background:linear-gradient(145deg,#351725,#170d13);display:flex;align-items:center;justify-content:center;text-align:center;font-size:17px;color:#f4d9e4}
.page{display:none;padding:15px}
.page.active{display:block}
.back{margin:8px 0 18px}
.years{display:grid;grid-template-columns:1fr;gap:9px}
.year{background:#29131e;border:1px solid #653247;padding:16px;border-radius:10px;text-align:center}
.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.photo{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;background:#24151c}
#viewer{display:none;position:fixed;inset:0;background:#080508;z-index:10;align-items:center;justify-content:center;flex-direction:column;padding:12px}
#viewer img{max-width:100%;max-height:78vh;object-fit:contain}
#viewer button{margin-top:12px}
#admin{display:none;background:#26121c;padding:13px;border-radius:12px;margin:12px 0}
#status{color:#d9aabd;text-align:center;font-size:13px;padding:10px}
input[type=file]{max-width:100%;margin:10px 0}
</style>
</head>
<body>
<header>
<h1>TAEKOOK MOMENTS ♡</h1>
<button onclick="setLang('ru')">RU</button>
<button onclick="setLang('en')">EN</button>
</header>

<div id="menu">
<div class="tile" onclick="openPage('photos')">📷<br>Photos</div>
<div class="tile" onclick="openPage('videos')">🎬<br>Videos</div>
<div class="tile" onclick="openPage('moments')">♡<br>Moments</div>
<div class="tile" onclick="openPage('timeline')">⌛<br>Timeline</div>
<div class="tile" onclick="openPage('edits')">✦<br>Edits</div>
<div class="tile" onclick="openPage('news')">✧<br>News</div>
<div class="tile" onclick="openPage('favorites')">♡<br>Favorites</div>
<div class="tile" onclick="openPage('about')">☾<br>About</div>
</div>

<section id="photos" class="page">
<button class="back" onclick="home()">← Главная</button>
<h2>Photos</h2>
<button onclick="showAlbum('latest')">Latest updates</button>
<h3>Archive</h3>
<div id="years" class="years"></div>
<div id="admin">
<h3>＋ Добавить фото</h3>
<input type="file" id="file" accept="image/*">
<br>
<select id="album">
<option value="latest">Latest updates</option>
</select>
<br>
<button onclick="uploadPhoto()">Загрузить</button>
</div>
<div id="gallery" class="photos"></div>
</section>

<div id="other" class="page">
<button class="back" onclick="home()">← Главная</button>
<h2 id="otherTitle"></h2>
<p>Раздел скоро появится ♡</p>
</div>

<div id="viewer">
<img id="largePhoto">
<button onclick="savePhoto()">Сохранить фото</button>
<button onclick="closeViewer()">Закрыть</button>
</div>
<div id="status"></div>

<script>
const SUPABASE_URL="https://oncimzmujksicnseqmzz.supabase.co";
const SUPABASE_KEY="sb_publishable_2Oh_uQynPaTGJ-Ob4yiOhw_VPmNNc--";
const FUNCTION_URL=SUPABASE_URL+"/functions/v1/taekook-admin";
const tg=window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

let currentAlbum="latest";
let currentPhoto="";
let photos=[];

const years=Array.from({length:14},(_,i)=>2026-i);

async function api(action,extra={},file=null){
const headers={
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY
};
if(tg?.initData)headers["x-telegram-init-data"]=tg.initData;

let response;
if(file){
const form=new FormData();
form.append("action",action);
Object.entries(extra).forEach(([k,v])=>form.append(k,v));
form.append("file",file);
response=await fetch(FUNCTION_URL,{method:"POST",headers,body:form});
}else{
headers["Content-Type"]="application/json";
response=await fetch(FUNCTION_URL,{
method:"POST",headers,
body:JSON.stringify({action,...extra})
});
}
const data=await response.json();
if(!response.ok)throw new Error(data.error||data.message||"Ошибка сервера");
return data;
}

function home(){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById("menu").style.display="grid";
document.getElementById("status").textContent="";
}
function openPage(name){
document.getElementById("menu").style.display="none";
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
if(name==="photos"){
document.getElementById("photos").classList.add("active");
}else{
document.getElementById("other").classList.add("active");
document.getElementById("otherTitle").textContent=name.toUpperCase();
}
}
function setLang(lang){
document.documentElement.lang=lang;
}
function makeYears(){
const box=document.getElementById("years");
const select=document.getElementById("album");
years.forEach(y=>{
const b=document.createElement("div");
b.className="year";
b.textContent=y;
b.onclick=()=>showAlbum(String(y));
box.appendChild(b);
const option=document.createElement("option");
option.value=String(y);
option.textContent=y;
select.appendChild(option);
});
}
async function loadPhotos(){
try{
const data=await api("list");
photos=data.photos||[];
}catch(e){
document.getElementById("status").textContent="Не удалось загрузить фотографии: "+e.message;
}
}
async function showAlbum(album){
currentAlbum=album;
document.getElementById("gallery").innerHTML="";
document.getElementById("status").textContent="Загрузка...";
await loadPhotos();
const found=photos.filter(p=>{
const path=p.path||"";
return album==="latest"?path.startsWith("latest/"):path.startsWith(album+"/");
});
const gallery=document.getElementById("gallery");
found.forEach(p=>{
const img=document.createElement("img");
img.className="photo";
img.src=p.url;
img.onclick=()=>viewPhoto(p.url,p.path);
gallery.appendChild(img);
});
document.getElementById("status").textContent=found.length?"":"В этом альбоме пока нет фотографий.";
}
function viewPhoto(url,path){
currentPhoto=url;
document.getElementById("largePhoto").src=url;
document.getElementById("viewer").style.display="flex";
document.getElementById("viewer").dataset.path=path;
}
function closeViewer(){
document.getElementById("viewer").style.display="none";
}
async function savePhoto(){
try{
const response=await fetch(currentPhoto);
const blob=await response.blob();
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download="taekook-photo.jpg";
a.click();
URL.revokeObjectURL(url);
}catch(e){
window.open(currentPhoto,"_blank");
}
}
async function uploadPhoto(){
const file=document.getElementById("file").files[0];
if(!file){alert("Сначала выбери фотографию");return}
try{
document.getElementById("status").textContent="Загружаю...";
await api("upload",{album:document.getElementById("album").value},file);
document.getElementById("file").value="";
await showAlbum(document.getElementById("album").value);
document.getElementById("status").textContent="Фото загружено ♡";
}catch(e){
document.getElementById("status").textContent="Ошибка: "+e.message;
}
}

async function checkAdmin(){
try{
const result=await api("admin-check");
if(result.admin===true)document.getElementById("admin").style.display="block";
}catch(e){
console.log("Admin check:",e.message);
}
}
makeYears();
checkAdmin();
</script>
</body>
</html>
